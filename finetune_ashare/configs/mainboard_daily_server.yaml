# 服务器配置（lookback=300, 50×2000 steps, batch 32×2=64）
# 使用前请改 data.db_path 为本机 kline.db 绝对路径
data:
  db_path: "/data-qfs/yangbin/storage/kline.db"
  lookback_window: 300
  predict_window: 5
  max_context: 512
  clip: 5.0

split:
  backtest_start: "2026-01-01"
  val_block_trading_days: 100
  val_symbol_ratio: 0.2
  seed: 42

training:
  tokenizer_epochs: 5
  basemodel_epochs: 50
  batch_size: 32
  log_interval: 200
  num_workers: 4
  seed: 42
  tokenizer_learning_rate: 0.0002
  predictor_learning_rate: 0.00002
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_weight_decay: 0.1
  accumulation_steps: 2
  n_train_steps_per_epoch: 2000
  n_val_loss_batches: 50
  n_val_day1_samples: 128
  onecycle_pct_start: 0.15
  onecycle_div_factor: 10
  onecycle_final_div_factor: 10
  save_epoch_checkpoints: true

model_paths:
  pretrained_tokenizer: "./pretrained/Kronos-Tokenizer-base"
  pretrained_predictor: "./pretrained/Kronos-base"
  exp_name: "mainboard_daily_server"
  base_path: "./finetune_ashare/outputs"

eval:
  run_backtest: true
  backtest_max_samples: 256
  day1_T: 1.0
  day1_top_p: 0.9
  day1_sample_count: 1

device:
  use_cuda: true
  device_id: 0

logging:
  use_tensorboard: true

data:
  db_path: "../stock_qmt/storage/kline.db"
  lookback_window: 200
  predict_window: 5
  max_context: 512
  clip: 5.0

split:
  backtest_start: "2026-01-01"
  val_block_trading_days: 100
  val_symbol_ratio: 0.2
  seed: 42

training:
  tokenizer_epochs: 5
  basemodel_epochs: 10
  batch_size: 32
  log_interval: 50
  num_workers: 0
  seed: 42
  tokenizer_learning_rate: 0.0002
  predictor_learning_rate: 0.00002
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_weight_decay: 0.1
  accumulation_steps: 1
  n_train_steps_per_epoch: 500
  n_val_loss_batches: 50
  n_val_day1_samples: 128

model_paths:
  pretrained_tokenizer: "./pretrained/Kronos-Tokenizer-base"
  pretrained_predictor: "./pretrained/Kronos-base"
  exp_name: "mainboard_daily_v1"
  base_path: "./finetune_ashare/outputs"

eval:
  run_backtest: true
  backtest_max_samples: 256
  day1_T: 1.0
  day1_top_p: 0.9
  day1_sample_count: 1

device:
  use_cuda: true
  device_id: 0

logging:
  use_tensorboard: true
